# Static Linux builds from any host (macOS included) with no external toolchain:
# the musl targets ship their own C runtime and rust-lld links ELF directly.
#
#   rustup target add x86_64-unknown-linux-musl
#   cargo build --release --target x86_64-unknown-linux-musl
#   scp target/x86_64-unknown-linux-musl/release/queuetop login-node:bin/

[target.x86_64-unknown-linux-musl]
linker = "rust-lld"
rustflags = ["-C", "target-feature=+crt-static", "-C", "link-self-contained=yes"]

[target.aarch64-unknown-linux-musl]
linker = "rust-lld"
rustflags = ["-C", "target-feature=+crt-static", "-C", "link-self-contained=yes"]
